<body class="bg-surface min-h-screen flex flex-col items-center justify-center p-4 antialiased">
<!-- Main Login Card -->
<main class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-md border border-outline-variant/30 p-8 sm:p-10 flex flex-col gap-8 relative overflow-hidden">
<!-- Subtle Top Accent Line -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary-container"></div>
<!-- Header: Logo & Title -->
<header class="flex flex-col items-center text-center gap-5">
<img alt="Logo SupTech Business School" class="h-14 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLtzoZ2rcpMxMScovgaHRyc7GYXZ38veD2Icj5ryxozctkkqhQgiVxtyGP3X3oUVUx665NG_e-7F3cQxWJFoxm1DxKC5kz597JAPjIPkOFtdvQDvcXzFYjRi8-_UOKz5efA5xZSUR1zHF0CH5X1b3PY-vwvhMFhMN31PMuQEjmDm4yCbDlIy5zpvq0CLObjS7CwKt7pLVkeKKXzNt4faSKXdsdR-dQRaclSR4QH20G7KZxp76JlG1XnWbi24"/>
<div class="flex flex-col gap-1">
<h1 class="font-headline-md text-headline-md text-on-surface">SupTech Business School</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Gestion Académique</p>
</div>
</header>
<!-- Login Form -->
<form class="flex flex-col gap-5">
<!-- Email Input Group -->
<div class="flex flex-col gap-1.5">
<label class="font-body-sm text-body-sm text-on-surface font-semibold" for="email">
                    Adresse Email
                </label>
<div class="relative">
<span class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">mail</span>
</span>
<input autocomplete="email" class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-10 pr-3 py-2.5 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-all shadow-sm placeholder:text-outline-variant" id="email" name="email" placeholder="prenom.nom@suptech.sn" required="" type="email"/>
</div>
</div>
<!-- Password Input Group -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-baseline">
<label class="font-body-sm text-body-sm text-on-surface font-semibold" for="password">
                        Mot de passe
                    </label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-fixed-variant transition-colors" href="#">
                        Mot de passe oublié ?
                    </a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</span>
<input autocomplete="current-password" class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-10 pr-3 py-2.5 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-all shadow-sm placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<div class="pt-3">
<button class="w-full bg-primary-container text-on-primary font-title-sm text-title-sm py-3 px-4 rounded-lg hover:bg-primary-fixed-variant transition-colors shadow-sm flex items-center justify-center gap-2 group" type="submit">
<span>Se connecter</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer Help Text -->
<footer class="text-center mt-2 border-t border-outline-variant/30 pt-6">
<p class="font-body-sm text-body-sm text-on-surface-variant flex items-center justify-center gap-1.5">
<span class="material-symbols-outlined text-[16px]">help</span>

</p>
</footer>
